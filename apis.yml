aid: indexed-vc
name: Indexed
image: https://indexed.vc/opengraph-image?2ed8c04617ed383e
description: Indexed provides a private-company intelligence platform offering searchable data on companies, investors, and funding rounds. Users
  can look up companies by name or domain, explore detailed funding histories, investor relationships, and export data via a REST API. The service
  includes tiered pricing with free credits and paid plans for higher usage, API keys for authentication, and features such as bulk enrichment,
  webhooks, and scheduled exports.
